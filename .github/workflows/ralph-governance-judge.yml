# Generated by `ralph init --governance`.
# Scores every sprint/* PR for governance compliance from outside Ralph's
# own process — queries real GitHub API state and evidence ledger.
# No API keys or external services required.
name: ralph-governance-judge

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  judge:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'sprint/')
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Judge governance compliance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
        run: node .github/scripts/ralph-judge.mjs
