# Generated by `ralph init --governance`.
#
# Runs the same checks Ralph verifies locally, so "required status checks"
# branch protection can enforce them on every PR — including Ralph's own.
name: ralph-checks

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type Check
        run: npm run typecheck
      - name: Unit Tests
        run: npm run test
