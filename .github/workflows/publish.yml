name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Check if version changed
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          # Check the exact version, not the latest tag — re-running a
          # workflow must not attempt to publish over an existing version
          if npm view "ralph-agent@$CURRENT" version >/dev/null 2>&1; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "v$CURRENT already published — skipping"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Publishing v$CURRENT"
          fi
          # Prereleases (alpha/beta/rc) go under the `next` dist-tag so
          # `npx ralph-agent` keeps resolving to the last stable release
          if [[ "$CURRENT" == *-* ]]; then
            echo "tag=next" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish
        if: steps.version.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag ${{ steps.version.outputs.tag }}
